name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install --quiet "huggingface_hub>=0.25"

      - name: Upload to HF Space + ensure secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set"
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)

          # Upload code
          api.upload_folder(
              folder_path=".",
              repo_id="avdeevrus/ufo-hosting-dashboard",
              repo_type="space",
              commit_message="Sync from GitHub via Actions",
              ignore_patterns=[
                  ".git/*", ".git", ".github/*",
                  "data/orders/*.csv", "data/ads/*.xlsx",
                  ".venv/*", "__pycache__/*", "**/__pycache__/*",
                  "*.pyc", ".playwright-mcp/*", "*.png",
                  ".claude/*", "reports/*",
              ],
          )
          print("✓ Code uploaded")

          # Set secrets in Space (idempotent)
          secrets_to_sync = [
              ("HF_TOKEN", token, "For accessing private dataset"),
              ("APP_PASSWORD", os.environ.get("APP_PASSWORD"), "Login password for dashboard"),
              ("YANDEX_DIRECT_TOKEN", os.environ.get("YANDEX_DIRECT_TOKEN"), "Yandex.Direct API OAuth token"),
          ]
          for key, value, desc in secrets_to_sync:
              if not value:
                  continue
              try:
                  api.add_space_secret(
                      repo_id="avdeevrus/ufo-hosting-dashboard",
                      key=key, value=value, description=desc,
                  )
                  print(f"✓ {key} secret synced to Space")
              except Exception as e:
                  print(f"⚠️ Could not set {key}: {e}")

          print("Pushed to https://huggingface.co/spaces/avdeevrus/ufo-hosting-dashboard")
          PY
