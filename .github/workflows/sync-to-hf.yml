name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: avdeevrus
          HF_SPACE: ufo-hosting-dashboard
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set"
            exit 1
          fi
          git config --global user.email "avdeevrus@users.noreply.github.com"
          git config --global user.name "GitHub Action HF Sync"
          REMOTE="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}"
          git push --force "$REMOTE" main
          echo "Pushed to https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}"
