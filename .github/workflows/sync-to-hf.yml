name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install --quiet "huggingface_hub>=0.25"

      - name: Upload to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set"
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".",
              repo_id="avdeevrus/ufo-hosting-dashboard",
              repo_type="space",
              commit_message="Sync from GitHub via Actions",
              ignore_patterns=[
                  ".git/*",
                  ".git",
                  ".github/*",
                  "data/orders/*.csv",
                  "data/ads/*.xlsx",
                  ".venv/*",
                  "__pycache__/*",
                  "**/__pycache__/*",
                  "*.pyc",
                  ".playwright-mcp/*",
                  "*.png",
                  ".claude/*",
                  "reports/*",
              ],
          )
          print("Pushed to https://huggingface.co/spaces/avdeevrus/ufo-hosting-dashboard")
          PY
