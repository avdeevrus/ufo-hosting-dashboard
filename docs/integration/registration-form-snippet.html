<!--
  Пример интеграции с формой регистрации UFO Hosting.

  Вставить эти hidden-поля внутри <form> формы регистрации (после видимых
  полей "email", "пароль" и т.д.) + JS-блок перед </body>.

  ВАЖНО: в JS заменить YOUR_METRIKA_COUNTER_ID на реальный ID счётчика
  Яндекс.Метрики (число вроде 12345678).
-->

<form id="registration-form" method="POST" action="/api/register">
  <!-- ... ваши обычные поля (email, password, и т.д.) ... -->

  <!-- ▼▼▼ Hidden-поля для сквозной аналитики ▼▼▼ -->
  <input type="hidden" name="utm_source"        id="ufo_attr_utm_source">
  <input type="hidden" name="utm_medium"        id="ufo_attr_utm_medium">
  <input type="hidden" name="utm_campaign"      id="ufo_attr_utm_campaign">
  <input type="hidden" name="utm_content"       id="ufo_attr_utm_content">
  <input type="hidden" name="utm_term"          id="ufo_attr_utm_term">
  <input type="hidden" name="yclid"             id="ufo_attr_yclid">
  <input type="hidden" name="metrika_client_id" id="ufo_attr_metrika_client_id">
  <input type="hidden" name="first_visit_at"    id="ufo_attr_first_visit_at">
  <!-- ▲▲▲ /attribution-поля ▲▲▲ -->

  <button type="submit">Зарегистрироваться</button>
</form>


<script>
  // ===== Заполнение attribution-полей перед отправкой формы =====
  (function () {
    var COUNTER_ID = YOUR_METRIKA_COUNTER_ID; // ← заменить на реальный ID

    function getCookie(name) {
      var m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
      return m ? decodeURIComponent(m.pop()) : "";
    }

    function fillAttribution() {
      // UTM + yclid из cookie (положены туда utm-capture.js при первом визите)
      var fields = {
        "ufo_attr_utm_source":     "utm_source",
        "ufo_attr_utm_medium":     "utm_medium",
        "ufo_attr_utm_campaign":   "utm_campaign",
        "ufo_attr_utm_content":    "utm_content",
        "ufo_attr_utm_term":       "utm_term",
        "ufo_attr_yclid":          "yclid",
        "ufo_attr_first_visit_at": "ufo_first_visit",
      };
      Object.keys(fields).forEach(function (inputId) {
        var el = document.getElementById(inputId);
        if (el) el.value = getCookie(fields[inputId]);
      });

      // ClientID Метрики — асинхронный вызов, нужно дождаться callback'а
      if (typeof window.ym === "function") {
        try {
          window.ym(COUNTER_ID, "getClientID", function (clientID) {
            var el = document.getElementById("ufo_attr_metrika_client_id");
            if (el && clientID) el.value = clientID;
          });
        } catch (e) {
          // Если Метрика не успела загрузиться — просто оставляем поле пустым
        }
      }
    }

    // 1) Заполняем при загрузке страницы — если Метрика уже инициализирована,
    //    ClientID попадёт в поле сразу
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", fillAttribution);
    } else {
      fillAttribution();
    }

    // 2) Дозаполняем перед submit'ом — на случай если ClientID появился позже
    var form = document.getElementById("registration-form");
    if (form) {
      form.addEventListener("submit", function (e) {
        // Не блокируем submit — просто на всякий случай ещё раз освежим UTM
        fillAttribution();
      });
    }
  })();
</script>
